name: Build Eleventy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
       - uses: actions/checkout@v4

       - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

       - name: Install dependencies & build
        run: |
          npm ci
          npm run build:clean

       - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./_site
          github_token: ${{ secrets.GITHUB_TOKEN }}
